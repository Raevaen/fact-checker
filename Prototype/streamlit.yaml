# Non-secret configuration for the Streamlit fact-checker app.
# The API key is expected in a Secret named otari-streamlit-auth (key: api-key):
#   kubectl create secret generic otari-streamlit-auth --from-literal=api-key=<OTARI_API_KEY>
apiVersion: v1
kind: ConfigMap
metadata:
  name: otari-streamlit-caddy
data:
  Caddyfile: |
    otari-streamlit.italynorth.cloudapp.azure.com {
        reverse_proxy 127.0.0.1:8501
    }

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: otari-streamlit-config
data:
  OTARI_BASE_URL: "https://eu.api.otari.ai"
  OTARI_MODEL: "openai/gpt-oss-safeguard-20b"
  OTARI_VERIFICATION_MODEL: "openai/gpt-oss-120b"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: streamlit-caddy-data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: managed-csi
  resources:
    requests:
      storage: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otari-streamlit
  labels:
    app: otari-streamlit
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otari-streamlit
  template:
    metadata:
      labels:
        app: otari-streamlit
    spec:
      containers:
        # Streamlit fact-checker UI
        - name: streamlit
          image: myprototypes-hvehavadeebyeehe.azurecr.io/otari-streamlit:latest
          envFrom:
            - configMapRef:
                name: otari-streamlit-config
          env:
            - name: OTARI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: otari-streamlit-auth
                  key: api-key
            - name: OTARI_SERVICE_KEY
              valueFrom:
                secretKeyRef:
                  name: otari-streamlit-auth-enduser
                  key: api-key
          ports:
            - name: http
              containerPort: 8501
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /_stcore/health
              port: 8501
            initialDelaySeconds: 10
            periodSeconds: 20

        - name: caddy
          image: caddy:2-alpine
          ports:
            - name: caddy-http
              containerPort: 80
            - name: caddy-https
              containerPort: 443
          volumeMounts:
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /etc/caddy
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
      volumes:
        - name: caddy-data
          persistentVolumeClaim:
            claimName: streamlit-caddy-data
        - name: caddy-config
          configMap:
            name: otari-streamlit-caddy

---
# Internal service for the Streamlit app
apiVersion: v1
kind: Service
metadata:
  name: otari-streamlit
spec:
  type: ClusterIP
  selector:
    app: otari-streamlit
  ports:
    - name: http
      port: 80
      targetPort: 8501

---
# Public service for the Streamlit app
apiVersion: v1
kind: Service
metadata:
  name: otari-streamlit-public
  annotations:
    service.beta.kubernetes.io/azure-dns-label-name: otari-streamlit
spec:
  type: LoadBalancer
  selector:
    app: otari-streamlit
  ports:
    - name: http
      port: 80
      targetPort: caddy-http
    - name: https
      port: 443
      targetPort: caddy-https
